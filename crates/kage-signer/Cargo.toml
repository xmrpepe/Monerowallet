[package]
name = "kage-signer"
description = "ZeroTrace offline signer. The ONLY crate that touches the spend key. No networking, no async runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Every dependency of this crate, direct or transitive, must be listed in
# crates/kage-signer/ALLOWED_DEPS (enforced by scripts/check-signer-deps.sh).
[dependencies]
kage-airgap.workspace = true
kage-harden.workspace = true
kage-sys.workspace = true
kage-vault.workspace = true
monero-wallet.workspace = true
zeroize.workspace = true

[[bin]]
name = "kage-signer"
path = "src/bin/kage-signer.rs"

[lints]
workspace = true
