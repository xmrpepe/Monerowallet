[workspace]
resolver = "3"
members = [
    "crates/kage-sys",
    "crates/kage-harden",
    "crates/kage-vault",
    "crates/kage-airgap",
    "crates/kage-signer",
    "crates/kage-core",
    "crates/kage-node",
    "crates/kage-tui",
    "crates/kage-hw",
]
# The fuzz workspace is separate (needs nightly + libfuzzer); see fuzz/.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-only"
repository = "https://github.com/xmrpepe/Monerowallet"
publish = false

# Every external dependency is pinned to an exact version (`=`). Cargo.lock is
# committed and every build in CI uses `--locked`. Bumps go through `cargo vet`.
[workspace.dependencies]
# Internal crates
kage-sys = { path = "crates/kage-sys" }
kage-harden = { path = "crates/kage-harden" }
kage-vault = { path = "crates/kage-vault" }
kage-airgap = { path = "crates/kage-airgap" }
kage-core = { path = "crates/kage-core" }
kage-node = { path = "crates/kage-node" }

# Monero protocol (ADR-001). Default features only: no networking (verified by
# scripts/check-signer-deps.sh in CI).
monero-wallet = { version = "=0.2.0", default-features = true }

# Cryptography: RustCrypto only (ADR-004).
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }

# Secrets & randomness
zeroize = { version = "=1.9.1", features = ["derive"] }
secrecy = { version = "=0.10.3" }
getrandom = { version = "=0.4.3" }
# OS CSPRNG as a `CryptoRng` for monero-wallet APIs (rand_core 0.6 = what it uses).
rand_core = { version = "=0.6.4", features = ["getrandom"] }
subtle = { version = "=2.6.1" }

# OS interfaces. NOTE: never enable rustix's `net` feature anywhere.
rustix = { version = "=1.1.5", default-features = false, features = ["std", "mm", "process", "fs", "param"] }

# Monero node RPC (kage-node only). Transport is our own (kage-node::transport).
monero-daemon-rpc = { version = "=0.2.0", default-features = false, features = ["std"] }
monero-interface = { version = "=0.2.0" }

# Networking (kage-node only; banned from the signer, ADR-012).
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
http-body-util = { version = "=0.1.5" }
http = { version = "=1.5.0" }
bytes = { version = "=1.12.1" }
serde_json = { version = "=1.0.154" }
# Tor. No native-tls/OpenSSL (ADR-005); static sqlite for the static release build.
tor-rtcompat = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls"] }
arti-client = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls", "compression", "onion-service-client", "static-sqlite"] }

# Errors
thiserror = { version = "=2.0.21" }

# Dev-only
proptest = { version = "=1.12.0" }
tempfile = { version = "=3.27.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
dbg_macro = "deny"
print_stdout = "warn"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"

[profile.release]
# Reproducibility + hardening (see docs/REPRODUCIBLE.md).
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
debug = false
strip = "symbols"
incremental = false
overflow-checks = true

[profile.dev]
overflow-checks = true

# Optimise all third-party code in dev/test builds: Argon2 and curve
# arithmetic (scanning, decoys) are unusably slow unoptimised. Our own crates
# stay at opt-level 0 with overflow checks for debugging.
[profile.dev.package."*"]
opt-level = 3
